<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="tracker.css?v=20261001-1">
    <script src="transitions.js?v=20260818"></script>
</head>
<body>
    <div class="page-header">
        <a class="home-button" href="welcome.html">Home</a>
    </div>

    <main class="welcome-page">
        <section class="welcome-card">
            <div class="auth-status-icon" aria-hidden="true">?</div>
            <h1>Forgot Your Password?</h1>
            <p class="welcome-text">Enter your email and we'll send you a secure link to create a new password.</p>

            <form id="forgotPasswordForm" class="auth-form auth-form-centered">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" autocomplete="email" placeholder="you@example.com" required>
                <button id="sendResetButton" type="submit">Send Reset Link</button>
            </form>

            <p id="forgotPasswordMessage" class="login-message" aria-live="polite"></p>
            <a class="forgot-password-link" href="login.html" data-transition-direction="back">Back to Log In</a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260928-2"></script>
    <script src="auth-service.js?v=20261001-1"></script>
    <script src="forgot-password.js?v=20261001-1"></script>
</body>
</html>
