<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password</title>
    <link rel="stylesheet" href="tracker.css?v=20261001-1">
    <script src="transitions.js?v=20260818"></script>
</head>
<body>
    <div class="page-header">
        <a class="home-button" href="welcome.html">Home</a>
    </div>

    <main class="welcome-page">
        <section class="welcome-card">
            <div class="auth-status-icon" aria-hidden="true">🔒</div>
            <h1 id="resetPasswordHeading">Create a New Password</h1>
            <p id="resetPasswordIntro" class="welcome-text">Enter and confirm your new password below.</p>

            <form id="resetPasswordForm" class="auth-form auth-form-centered" hidden>
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>

                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="6" placeholder="Re-enter your new password" required>

                <button id="saveNewPasswordButton" type="submit">Save New Password</button>
            </form>

            <p id="resetPasswordMessage" class="login-message" aria-live="polite">Checking your reset link...</p>
            <div id="resetPasswordActions" class="auth-status-actions" hidden>
                <a class="login-button" href="login.html">Go to Log In</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260928-2"></script>
    <script src="auth-service.js?v=20261001-1"></script>
    <script src="reset-password.js?v=20261001-1"></script>
</body>
</html>
