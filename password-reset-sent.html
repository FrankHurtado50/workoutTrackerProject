<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email</title>
    <link rel="stylesheet" href="tracker.css?v=20261001-1">
    <script src="transitions.js?v=20260818"></script>
</head>
<body>
    <div class="page-header">
        <a class="home-button" href="welcome.html">Home</a>
    </div>

    <main class="welcome-page">
        <section class="welcome-card">
            <div class="auth-status-icon" aria-hidden="true">✉</div>
            <h1>Check Your Email</h1>
            <p class="welcome-text">
                If an account exists<span id="resetEmailDestination"></span>, we'll send it a secure password-reset link.
            </p>
            <p class="subtext">Open the link in the email to create your new password. Check your spam or junk folder if it doesn't appear.</p>
            <div class="auth-status-actions">
                <a class="login-button" href="login.html" data-transition-direction="back">Back to Log In</a>
            </div>
        </section>
    </main>

    <script src="password-reset-sent.js?v=20261001-1"></script>

</html>
