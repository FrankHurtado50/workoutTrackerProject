<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routine Details</title>
    <link rel="stylesheet" href="tracker.css?v=20260928-2">
    <script src="transitions.js?v=20260818"></script>
</head>
<body>
    <div class="page-header">
        <a class="home-button" href="welcome.html">Home</a>
        <a class="login-button" href="login.html">Log In</a>
    </div>

    <main class="routine-details-page">
        <section class="routine-details-card">
            <a class="back-link" href="saved-routines.html" data-transition-direction="back">← Back to saved routines</a>
            <div id="routineDetailsContent">
                <div class="routine-details-title-row">
                    <h1 id="routineDetailsName">Routine</h1>
                    <button type="button" id="editRoutineButton" class="edit-routine-button">Edit Routine</button>
                </div>
                <p id="routineDetailsDate" class="subtext"></p>
                <p id="routineSavedMessage" class="routine-saved-message" role="status" hidden></p>
                <p id="routineEditMessage" class="routine-edit-message" role="status" hidden></p>
                <p id="routineProgress" class="routine-progress" aria-live="polite"></p>
                <div id="routineChecklist" class="routine-checklist"></div>
                <div id="routineEditActions" class="routine-edit-actions" hidden>
                    <button type="button" id="showAddRoutineWorkout" class="add-routine-workout-button">
                        + Add a workout to this routine?
                    </button>
                    <form id="addRoutineWorkoutForm" class="add-routine-workout-form" hidden>
                        <label for="newRoutineWorkout">New workout</label>
                        <input type="text" id="newRoutineWorkout" maxlength="80" placeholder="Example: Lat Pulldown" required>
                        <div class="add-routine-workout-form-actions">
                            <button type="submit">Save Workout</button>
                            <button type="button" id="cancelAddRoutineWorkout" class="cancel-add-routine-workout">Cancel</button>
                        </div>
                    </form>
                </div>
                <button type="button" id="submitRoutineSelection" class="submit-routine-selection" disabled>
                    Submit Selected Workouts
                </button>
            </div>
            <div id="routineNotFound" class="routine-not-found" hidden>
                <h1>Routine not found</h1>
                <p>This routine may no longer be available.</p>
                <a class="create-routine-link" href="saved-routines.html" data-transition-direction="back">View saved routines</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260928-2"></script>
    <script src="auth-service.js?v=20260928-2"></script>
    <script src="auth-header.js?v=20260928-2"></script>
    <script src="routine-details.js?v=20260928-2"></script>
</body>
</html>
